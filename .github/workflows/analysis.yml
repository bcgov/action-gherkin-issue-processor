name: Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect Changes
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.result.outputs.triggered }}
    steps:
      - name: Check triggers
        if: github.event_name == 'pull_request'
        uses: bcgov/actions/diff-triggers@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        id: diff
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          triggers: |
            .github/linters/
            .github/sample.feature
            .github/workflows/analysis.yml
            .node-version
            .prettierignore
            .prettierrc.json
            __tests__/
            action.yml
            package-lock.json
            package.json
            src/
            tsconfig.json
            vitest.config.ts
      - id: result
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=${{ steps.diff.outputs.triggered }}" >> "$GITHUB_OUTPUT"
          fi

  test-action:
    name: GitHub Actions Test
    needs: [changes]
    if: needs.changes.outputs.triggered == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies and Build Dist
        run: |
          npm ci
          npm run bundle
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          issue: 1

      - name: Print Output
        run: |
          echo "${{ steps.test-action.outputs.feature }}"
          echo "${{ steps.test-action.outputs.feature }}" > .github/ci.feature

      - name: Validate Feature
        run: |
          # Check if the content of .github/ci.feature is the same as the .github/sample.feature file and fail if is not
          diff .github/ci.feature .github/sample.feature

      - name: Upload generated feature on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CI Feature
          path: .github/ci.feature

  test-typescript:
    name: TypeScript Tests
    needs: [changes]
    if: needs.changes.outputs.triggered == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies and Build Dist
        run: |
          npm ci
          npm run bundle

      - name: Check Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run coverage

  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          scan-type: 'fs'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL'

      - name: Upload Trivy scan results to GitHub Security tab (PR)
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4
        with:
          category: 'trivy'
          sarif_file: 'trivy-results.sarif'
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4
        with:
          category: 'trivy'
          sarif_file: 'trivy-results.sarif'

  results:
    name: Analysis Results
    needs: [changes, test-action, test-typescript, trivy]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
